name: WristWords

options:
  minimumXcodeGenVersion: "2.46.0"
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO

targets:
  WristWords:
    type: application
    platform: iOS
    sources:
      - WristWords/App
      - WristWords/Data
      - WristWords/Credentials
      - WristWords/Sync
      - WristWords/Resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WristWords
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: .generated/WristWords-Info.plist
      properties:
        CFBundleDisplayName: WristWords
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: WristWordsWatch
        embed: true
        link: false
        codeSign: false
        # Modern single-target watchOS applications use the PlugIns directory.
        copy:
          destination: plugins

  WristWordsWatch:
    type: application
    platform: watchOS
    sources:
      - WristWordsWatch/App
      - WristWordsWatch/Study
      - WristWordsWatch/Sync
      - WristWordsWatch/Resources
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WristWords.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: .generated/WristWordsWatch-Info.plist
      properties:
        CFBundleDisplayName: WristWords
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.WristWords
        WKRunsIndependentlyOfCompanionApp: true

  WristWordsCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Shared
      - WristWords/Data
      - Tests
      - WristWordsWatch/Study
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WristWords.coretests
    info:
      path: .generated/WristWordsCoreTests-Info.plist
      properties: {}

schemes:
  WristWords:
    build:
      targets:
        WristWords: all
    run:
      config: Debug
  WristWordsWatch:
    build:
      targets:
        WristWordsWatch: all
    run:
      config: Debug
  WristWordsCoreTests:
    build:
      targets:
        WristWordsCoreTests: [test]
    test:
      config: Debug
      targets:
        - WristWordsCoreTests
